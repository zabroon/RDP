name: RDP with bore (fixed)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

    - name: Restart RDP service and verify
      shell: powershell
      run: |
        Write-Host "Restarting Remote Desktop Services..."
        Restart-Service TermService -Force -ErrorAction Stop
        Start-Sleep -Seconds 5
        $test = Test-NetConnection -ComputerName localhost -Port 3389
        if ($test.TcpTestSucceeded) {
            Write-Host "✅ RDP service is listening on port 3389"
        } else {
            Write-Host "❌ RDP service not listening"
            exit 1
        }

    - name: Download bore
      run: |
        Invoke-WebRequest -Uri https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip -OutFile bore.zip
        Expand-Archive bore.zip -DestinationPath .

    - name: Start bore and capture address
      shell: powershell
      run: |
        Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore-output.txt" -NoNewWindow
        Start-Sleep -Seconds 5
        $output = Get-Content "bore-output.txt" -Raw
        if ($output -match 'listening at (\S+)') {
            $address = $matches[1]
            "RDP Address: $address" | Out-File -FilePath "rdp-address.txt" -Encoding utf8
            Write-Host "✅ Your RDP address is: $address"
        } else {
            "Could not detect address." | Out-File -FilePath "rdp-address.txt" -Encoding utf8
        }

    - name: Test RDP connectivity
      shell: powershell
      run: |
        $addressLine = Get-Content "rdp-address.txt" -Raw
        if ($addressLine -match 'RDP Address: (.+)') {
            $fullAddress = $matches[1].Trim()
            Write-Host "Testing RDP at: $fullAddress"
            $hostname, $port = $fullAddress -split ':'
            try {
                $tcp = New-Object System.Net.Sockets.TcpClient
                $tcp.Connect($hostname, [int]$port)
                $stream = $tcp.GetStream()
                $buffer = New-Object byte[] 8
                $stream.Read($buffer, 0, $buffer.Length) | Out-Null
                $response = [System.Text.Encoding]::ASCII.GetString($buffer)
                if ($response -match "RDP") {
                    Write-Host "✅ RDP server is live and responding!"
                } else {
                    Write-Host "⚠️ Connected but no RDP banner received."
                }
                $tcp.Close()
            } catch {
                Write-Host "❌ Failed to connect: $_"
                exit 1
            }
        } else {
            Write-Host "❌ Could not parse address from rdp-address.txt"
            exit 1
        }

    - name: Upload address as artifact
      uses: actions/upload-artifact@v4
      with:
        name: rdp-address
        path: rdp-address.txt

    - name: Keep session alive
      run: Start-Sleep -Seconds 3600
